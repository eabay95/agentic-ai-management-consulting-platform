<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>System Evaluation</title><style>body{font:16px system-ui;background:#f5f6f3;color:#20312e;max-width:1000px;margin:40px auto;padding:20px}section{background:white;border:1px solid #ccd8ce;border-radius:12px;padding:20px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#245e4b}</style><a href="/">Back to consulting</a><h1>Measured evaluation</h1><p>Small developer-labeled suites measure prototype behavior. Citation identity and structure do not prove factual correctness. Human quality judgments remain separate.</p><main id="results">Loading saved results…</main><script>
fetch('/evaluation').then(r=>{if(!r.ok)throw new Error('Evaluation report unavailable');return r.json()}).then(report=>{const root=document.querySelector('#results');root.textContent='';for(const [key,value] of Object.entries(report)){const section=document.createElement('section'),h=document.createElement('h2'),pre=document.createElement('pre');h.textContent=key.replaceAll('_',' ');pre.textContent=JSON.stringify(value,null,2);section.append(h,pre);root.append(section);}}).catch(error=>document.querySelector('#results').textContent=error.message);
</script></html>
